name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из поля packageManager корневого package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # miniapp импортирует dist пакетов workspace — собираем в порядке зависимостей
      - run: pnpm --filter @tennis-ai/shared build
      - run: pnpm --filter @tennis-ai/engine build

      # base=/tennis.ai/ соответствует Pages-URL проекта petrenkonik.github.io/tennis.ai/
      - run: pnpm --filter @tennis-ai/miniapp exec vite build --base=/tennis.ai/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/miniapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
